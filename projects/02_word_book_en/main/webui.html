<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>word book</title>
<style>
body{font-family:-apple-system,system-ui,sans-serif;margin:0;background:#111;color:#eee}
h1{font-size:20px;margin:16px}
#card{margin:0 16px 12px;color:#9ab}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:0 16px 24px}
.w{background:#222;border-radius:12px;overflow:hidden;position:relative}
.w canvas{width:100%;display:block;aspect-ratio:368/448;background:#333}
.w .t{padding:8px 10px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.w .t small{font-weight:400;color:#8a9}
.w.drag{outline:3px solid #6cf}
.w input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.w .x{background:none;border:0;color:#a66;font-size:16px;cursor:pointer}
form{margin:0 16px 16px;display:flex;gap:8px}
input[type=text]{flex:1;font-size:18px;padding:10px;border-radius:8px;border:1px solid #444;background:#1a1a1a;color:#eee;text-transform:uppercase}
button.add{font-size:18px;padding:10px 16px;border-radius:8px;border:0;background:#6cf;color:#000}
#msg{margin:0 16px 12px;color:#fc6;min-height:1.2em}
</style>
<h1>word book</h1>
<div id="card"></div>
<form onsubmit="return addWord(event)"><input id="nw" type="text" placeholder="new word, e.g. BANANA" maxlength="20"><button class="add">add</button></form>
<div id="msg"></div>
<div class="grid" id="grid"></div>
<script>
const W=368,H=448;
const grid=document.getElementById('grid'),msg=document.getElementById('msg');
function say(s){msg.textContent=s}
async function load(){
  const r=await fetch('/api/book');const b=await r.json();
  document.getElementById('card').textContent=b.card?'SD card present - drop a photo on a word':'NO SD CARD - insert one, photos have nowhere to go';
  grid.innerHTML='';
  for(const w of b.words){
    const d=document.createElement('div');d.className='w';
    d.innerHTML=`<canvas width="${W}" height="${H}"></canvas><div class="t"><span>${w.text}<small> ${w.photo?'photo':'text card'}</small></span><button class="x" title="remove word">&#x2715;</button></div><input type="file" accept="image/*">`;
    const c=d.querySelector('canvas');
    if(w.photo){drawPhoto(c,w.text)}else{placeholder(c,w.text)}
    d.querySelector('input').onchange=e=>upload(w.text,e.target.files[0],c);
    d.ondragover=e=>{e.preventDefault();d.classList.add('drag')};
    d.ondragleave=()=>d.classList.remove('drag');
    d.ondrop=e=>{e.preventDefault();d.classList.remove('drag');upload(w.text,e.dataTransfer.files[0],c)};
    d.querySelector('.x').onclick=async e=>{e.stopPropagation();if(!confirm('remove '+w.text+'?'))return;await fetch('/api/word/'+w.text,{method:'DELETE'});load()};
    grid.appendChild(d);
  }
}
function placeholder(c,t){const g=c.getContext('2d');g.fillStyle='#345';g.fillRect(0,0,W,H);g.fillStyle='#fff';g.font='bold 64px sans-serif';g.textAlign='center';g.fillText(t,W/2,H/2+22)}
async function drawPhoto(c,t){
  const r=await fetch('/api/photo/'+t);if(!r.ok)return placeholder(c,t);
  const buf=new Uint8Array(await r.arrayBuffer());const g=c.getContext('2d');const img=g.createImageData(W,H);
  for(let i=0,j=0;i<W*H;i++,j+=4){const v=buf[2*i]|(buf[2*i+1]<<8);img.data[j]=(v>>11)*255/31;img.data[j+1]=((v>>5)&63)*255/63;img.data[j+2]=(v&31)*255/31;img.data[j+3]=255}
  g.putImageData(img,0,0);
}
function upload(word,file,c){
  if(!file)return;say('preparing '+word+'...');
  const img=new Image();img.onload=()=>{
    const g=c.getContext('2d');
    const s=Math.max(W/img.width,H/img.height),sw=img.width*s,sh=img.height*s;
    g.drawImage(img,(W-sw)/2,(H-sh)/2,sw,sh);
    const d=g.getImageData(0,0,W,H).data,out=new Uint8Array(W*H*2);
    for(let i=0,j=0;i<W*H;i++,j+=4){const v=((d[j]&0xF8)<<8)|((d[j+1]&0xFC)<<3)|(d[j+2]>>3);out[2*i]=v&255;out[2*i+1]=v>>8}
    say('uploading '+word+' ('+Math.round(out.length/1024)+' KB)...');
    fetch('/api/photo/'+word,{method:'PUT',body:out}).then(r=>r.text().then(t=>{say(r.ok?word+' saved':'failed: '+t);if(r.ok)load()}));
    URL.revokeObjectURL(img.src);
  };
  img.onerror=()=>say('could not read that image');
  img.src=URL.createObjectURL(file);
}
async function addWord(e){e.preventDefault();const t=document.getElementById('nw').value.trim().toUpperCase();if(!t)return false;
  const r=await fetch('/api/word',{method:'POST',body:t});say(r.ok?t+' added':'failed: '+await r.text());document.getElementById('nw').value='';load();return false}
load();
</script>
